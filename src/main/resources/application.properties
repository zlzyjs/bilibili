spring.application.name=bilibili-home
spring.config.import=optional:file:./.local/application.properties,optional:file:./.local/application.override.properties
server.address=127.0.0.1
server.port=${BILI_PORT:8080}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.media-root=${BILI_MEDIA_ROOT:..}
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5126MB
spring.servlet.multipart.file-size-threshold=0B
spring.servlet.multipart.resolve-lazily=true
server.tomcat.max-swallow-size=-1
spring.datasource.url=${BILI_DB_URL:jdbc:mysql://127.0.0.1:3306/bilibili?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.username=${BILI_DB_USER:root}
spring.datasource.password=${BILI_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=4000
spring.datasource.hikari.initialization-fail-timeout=-1
