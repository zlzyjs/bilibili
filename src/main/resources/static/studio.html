<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创作中心 · dilidili</title>
  <link rel="stylesheet" href="/nav-brand.css?v=1">
  <link rel="stylesheet" href="/studio.css?v=34">
  <script src="/studio-upload.js?v=8" defer></script>
  <script src="/studio.js?v=17" defer></script>
</head>
<body>
  <svg class="studio-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="studio-icon-upload" viewBox="0 0 24 24"><path d="M12 15V4m-4 4 4-4 4 4M7 12H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2h-2m-1 4h1"/></symbol>
    <symbol id="studio-icon-home" viewBox="0 0 28 28"><path d="m2 11 12-10 12 10M5 9v12a4 4 0 0 0 4 4h10a4 4 0 0 0 4-4V9m-13 9a4 4 0 0 0 8 0"/></symbol>
    <symbol id="studio-icon-media" viewBox="0 0 28 28"><path d="M15 2H5a1 1 0 0 0-1 1v22h13M15 2l8 8v7m-8-15v8h8M10 12l5 3.5-5 3.5z"/><circle cx="22" cy="23" r="4"/><path d="m21 21.5 2.3 1.5-2.3 1.5z"/></symbol>
    <symbol id="studio-icon-data" viewBox="0 0 28 28"><rect x="3" y="3" width="22" height="18" rx="3"/><path d="m7 16 5-5 3 2 6-5M8 26h12"/></symbol>
    <symbol id="studio-icon-followers" viewBox="0 0 28 28"><circle cx="13" cy="8" r="6"/><path d="M3 26v-1a10 10 0 0 1 14-9.2m4 10.2-3.5-3.4a2.5 2.5 0 0 1 3.5-3.5 2.5 2.5 0 0 1 3.5 3.5z"/></symbol>
    <symbol id="studio-icon-income" viewBox="0 0 28 28"><path d="m11 7-3-5 4 .7L14 1l2 1.7 4-.7-3 5m-6 0h6c3 3 8 8 8 13 0 4-4 6-11 6S3 24 3 20c0-5 5-10 8-13Zm0 5 3 3 3-3m-6 4h6m-6 3h6m-3-4v7"/></symbol>
    <symbol id="studio-icon-site" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="m9 3 3 3 3-3M9 10v3m6-3v3"/></symbol>
    <symbol id="studio-icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
  </svg>
  <header class="studio-header">
    <a class="studio-brand" href="/studio"><span class="nav-brand-mark" role="img" aria-label="dilidili"></span> 创作中心</a>
    <a href="/" class="main-site"><svg class="studio-icon" aria-hidden="true"><use href="#studio-icon-site"/></svg>主站</a>
    <div class="studio-header-tools">
      <div class="studio-inbox-wrap">
        <button type="button" class="studio-inbox" aria-label="消息中心" aria-expanded="false" aria-controls="studio-inbox-menu"><svg class="studio-icon" aria-hidden="true"><use href="#studio-icon-mail"/></svg></button>
        <nav id="studio-inbox-menu" class="studio-inbox-menu" aria-label="消息分类" hidden>
          <a href="/messages?tab=replies">回复我的</a>
          <a href="/messages?tab=mentions">@我的</a>
          <a href="/messages?tab=likes">收到的赞</a>
          <a href="/messages?tab=system">系统通知</a>
          <a href="/messages?tab=chat">我的消息</a>
        </nav>
      </div>
      <a href="/me" id="studio-account" hidden><span></span><img alt="" width="28" height="28"></a>
    </div>
  </header>
  <div class="studio-shell">
    <nav class="studio-nav" aria-label="创作中心">
      <a class="studio-upload-link" href="/studio/upload"><svg aria-hidden="true"><use href="#studio-icon-upload"/></svg>投稿</a>
      <a href="/studio"><svg aria-hidden="true"><use href="#studio-icon-home"/></svg>首页</a>
      <a href="/studio/videos"><svg aria-hidden="true"><use href="#studio-icon-media"/></svg>稿件管理</a>
      <a href="/studio/analytics"><svg aria-hidden="true"><use href="#studio-icon-data"/></svg>数据概览</a>
      <a href="/studio/fans"><svg aria-hidden="true"><use href="#studio-icon-followers"/></svg>粉丝管理</a>
      <details class="studio-nav-group">
        <summary><svg aria-hidden="true"><use href="#studio-icon-income"/></svg>收益管理</summary>
        <div class="studio-nav-submenu">
        <a href="/studio/income">收益中心</a>
        <a href="/studio/charge">充电计划</a>
        </div>
      </details>
    </nav>
    <main id="studio-content" class="studio-content" aria-busy="true">
    </main>
  </div>
</body>
</html>
